# API description for the ZAP API scan (scripts/owasp-scan.sh), written from docs/SPEC.md "API". Not used by the apps.
openapi: 3.0.3
info:
  title: Match Gateway
  version: "1"
servers:
  - url: http://gateway:8080
paths:
  /v1/subjects/{subjectId}/enrollment:
    post:
      parameters:
        - { name: subjectId, in: path, required: true, schema: { type: string, example: zap-subject } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template]
              properties:
                template: { type: string, example: "" }
      responses: { "201": { description: enrolled } }
  /v1/subjects/{subjectId}:
    delete:
      parameters:
        - { name: subjectId, in: path, required: true, schema: { type: string, example: zap-erase } }
      responses: { "204": { description: erased } }
  /v1/verifications:
    post:
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, example: zap-key-1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjectId, probeTemplate]
              properties:
                subjectId: { type: string, example: zap-subject }
                probeTemplate: { type: string, example: "" }
      responses: { "202": { description: accepted } }
  /v1/verifications/{verificationId}:
    get:
      parameters:
        - { name: verificationId, in: path, required: true, schema: { type: string, format: uuid, example: 00000000-0000-4000-8000-000000000000 } }
      responses: { "200": { description: result } }
  /v1/tenant/threshold:
    put:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [threshold]
              properties:
                threshold: { type: number, example: 0.5 }
      responses: { "200": { description: stored } }
  /actuator/health:
    get:
      responses: { "200": { description: health } }
