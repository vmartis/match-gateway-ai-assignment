spring:
  application:
    name: gateway
  # JSON-only API: no form or multipart parsing, which would read bodies before authentication and the 8 KB limit
  # (security review step 3, HIGH F-1/F-2).
  mvc:
    formcontent:
      filter:
        enabled: false
  servlet:
    multipart:
      enabled: false
  threads:
    virtual:
      enabled: true
  # Virtual threads make applicationTaskExecutor unbounded; eager outbox publishes must not pile up during a broker outage.
  # Saturation rejects the task and the outbox relay takes over (reviews step 12).
  # The limit applies to the whole shared applicationTaskExecutor (today only the outbox uses it).
  task:
    execution:
      simple:
        concurrency-limit: 64
        reject-tasks-when-limit-reached: true
  # Broker (ADR-009): password from the generated mqcreds configtree (compose), never in the repo.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:matchgw}
    password: ${RABBITMQ_PASSWORD:}
    # Publisher confirms + returns: the outbox row is deleted only for a confirmed, routed message (ADR-009).
    publisher-confirm-type: correlated
    # Bounded waits: a refused, blackholed or frozen broker never parks a publish for long (reviews step 12).
    connection-timeout: 2s
    channel-rpc-timeout: 5s
    publisher-returns: true
    template:
      mandatory: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/matchgw}
    username: ${DB_USER:matchgw}
    password: ${DB_PASSWORD:}
    hikari:
      data-source-properties:
        # PSQLException messages must never inline row values (probe bytes) – ARCHITECTURE T3.
        logServerErrorDetail: false

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false
    whitelabel:
      enabled: false

# Tomcat logs the first malformed request of each window at INFO with the raw input and a stack trace (security
# review step 3): attacker-controlled text must not reach the logs.
logging:
  level:
    org.apache.coyote.http11.Http11Processor: WARN
    # A failing broker health check is visible in readiness; its WARN + stack trace per probe would flood the logs.
    org.springframework.boot.amqp.health.RabbitHealthIndicator: ERROR

# Standard actuator on the API port (D-23): only health is exposed; status only; liveness/readiness probes.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,rabbit # D-24 + ADR-009: not ready while the database or broker is unreachable
  health:
    probes:
      enabled: true

# Resource server (ADR-004): public key only, mounted from the keygen volume in compose.
app:
  jwt:
    public-key-location: ${JWT_PUBLIC_KEY_LOCATION:file:/run/keys/jwt-public.pem}
    issuer: ${JWT_ISSUER:https://match-gateway.invalid/dev-issuer}
    audience: ${JWT_AUDIENCE:match-gateway}
  idempotency:
    hmac-key-location: ${IDEMPOTENCY_HMAC_KEY_LOCATION:file:/run/keys/idempotency-hmac.key}
